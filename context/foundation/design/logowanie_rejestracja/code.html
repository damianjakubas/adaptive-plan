<!-- Script for Tab Interaction (Visual only for prototype) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const submitBtnText = document.querySelector('button[type="submit"] span:first-child');
            
            const activeClass = ['text-primary-fixed', 'border-b-2', 'border-primary-container'];
            const inactiveClass = ['text-on-surface-variant', 'border-transparent', 'hover:text-on-surface'];
            
            tabRegister.addEventListener('click', () => {
                tabRegister.classList.add(...activeClass);
                tabRegister.classList.remove(...inactiveClass, 'border-b-0');
                
                tabLogin.classList.remove(...activeClass);
                tabLogin.classList.add(...inactiveClass);
                
                submitBtnText.textContent = 'Załóż konto';
            });
            
            tabLogin.addEventListener('click', () => {
                tabLogin.classList.add(...activeClass);
                tabLogin.classList.remove(...inactiveClass);
                
                tabRegister.classList.remove(...activeClass);
                tabRegister.classList.add(...inactiveClass);
                
                submitBtnText.textContent = 'Wejdź do strefy';
            });
        });
    </script>
